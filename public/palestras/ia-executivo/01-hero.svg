<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#F5F4EF"/>

  <!-- Hairline grid -->
  <line x1="0" y1="187" x2="1200" y2="187" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="0" y1="563" x2="1200" y2="563" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="750" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="750" stroke="#E5E3DC" stroke-width="1"/>

  <!-- Title -->
  <text x="80" y="170" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#6B6B6B">IA EXECUTIVA</text>
  <line x1="80" y1="180" x2="280" y2="180" stroke="#E5E3DC" stroke-width="1"/>

  <!-- Phase 1: Dado -->
  <rect x="80" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="100" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">01</text>
  <line x1="100" y1="295" x2="320" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="100" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Dado</text>
  <text x="100" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Email, reuniao, planilha,</text>
  <text x="100" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">contrato, dashboard.</text>
  <text x="100" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Volume cresce sem leitura.</text>
  <!-- Data streams (horizontal bars of varying length) -->
  <rect x="100" y="440" width="200" height="6" fill="#0A0A0A"/>
  <rect x="100" y="452" width="160" height="6" fill="#0A0A0A"/>
  <rect x="100" y="464" width="180" height="6" fill="#0A0A0A"/>
  <rect x="100" y="476" width="140" height="6" fill="#0A0A0A"/>
  <rect x="100" y="488" width="220" height="6" fill="#0A0A0A"/>

  <!-- Arrow 1->2 -->
  <line x1="360" y1="375" x2="440" y2="375" stroke="#0A0A0A" stroke-width="1.5"/>
  <polygon points="440,370 452,375 440,380" fill="#0A0A0A"/>

  <!-- Phase 2: Modelo -->
  <rect x="470" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="490" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">02</text>
  <line x1="490" y1="295" x2="710" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="490" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Modelo</text>
  <text x="490" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">IA processa contexto,</text>
  <text x="490" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">resume, sintetiza,</text>
  <text x="490" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">cruza fontes.</text>
  <!-- Network nodes -->
  <line x1="525" y1="455" x2="595" y2="445" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="525" y1="455" x2="595" y2="465" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="525" y1="455" x2="595" y2="485" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="525" y1="475" x2="595" y2="445" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="525" y1="475" x2="595" y2="465" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="525" y1="475" x2="595" y2="485" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="605" y1="445" x2="675" y2="455" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="605" y1="465" x2="675" y2="455" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="605" y1="485" x2="675" y2="475" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="605" y1="445" x2="675" y2="475" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="605" y1="465" x2="675" y2="475" stroke="#E5E3DC" stroke-width="1"/>
  <circle cx="525" cy="455" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="525" cy="475" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="600" cy="445" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="600" cy="465" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="600" cy="485" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="675" cy="455" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>
  <circle cx="675" cy="475" r="6" stroke="#0A0A0A" stroke-width="1.5" fill="#F5F4EF"/>

  <!-- Arrow 2->3 -->
  <line x1="750" y1="375" x2="830" y2="375" stroke="#0A0A0A" stroke-width="1.5"/>
  <polygon points="830,370 842,375 830,380" fill="#0A0A0A"/>

  <!-- Phase 3: Decisao -->
  <rect x="860" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="880" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">03</text>
  <line x1="880" y1="295" x2="1100" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="880" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Decisao</text>
  <text x="880" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Executivo decide com</text>
  <text x="880" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">sinal limpo, contexto</text>
  <text x="880" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">preservado, sem ruido.</text>
  <!-- Decision options -->
  <rect x="880" y="438" width="200" height="28" stroke="#E5E3DC" stroke-width="1" fill="none"/>
  <text x="895" y="457" font-family="monospace" font-size="11" letter-spacing="0.06em" fill="#6B6B6B">CENARIO A</text>
  <rect x="880" y="472" width="200" height="28" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <rect x="1072" y="472" width="8" height="28" fill="#CCFF00"/>
  <text x="895" y="491" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#0A0A0A">CENARIO B</text>

  <!-- Bottom label -->
  <text x="80" y="600" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Dado &gt; Modelo &gt; Decisao</text>
</svg>
