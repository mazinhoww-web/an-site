<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#F5F4EF"/>

  <!-- Hairline grid -->
  <line x1="0" y1="187" x2="1200" y2="187" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="0" y1="563" x2="1200" y2="563" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="750" stroke="#E5E3DC" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="750" stroke="#E5E3DC" stroke-width="1"/>

  <!-- Title -->
  <text x="80" y="170" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#6B6B6B">AGRO X FINTECH</text>
  <line x1="80" y1="180" x2="280" y2="180" stroke="#E5E3DC" stroke-width="1"/>

  <!-- Phase 1: Producao -->
  <rect x="80" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="100" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">01</text>
  <line x1="100" y1="295" x2="320" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="100" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Producao</text>
  <text x="100" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Safra fisica gera ativo</text>
  <text x="100" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">economico ainda nao</text>
  <text x="100" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">financeirizado.</text>
  <!-- Safra bars -->
  <rect x="100" y="450" width="22" height="40" fill="#0A0A0A"/>
  <rect x="130" y="465" width="22" height="25" fill="#0A0A0A"/>
  <rect x="160" y="440" width="22" height="50" fill="#0A0A0A"/>
  <rect x="190" y="455" width="22" height="35" fill="#0A0A0A"/>
  <rect x="220" y="445" width="22" height="45" fill="#0A0A0A"/>
  <rect x="250" y="430" width="22" height="60" fill="#0A0A0A"/>
  <rect x="280" y="450" width="22" height="40" fill="#0A0A0A"/>

  <!-- Arrow 1->2 -->
  <line x1="360" y1="375" x2="440" y2="375" stroke="#0A0A0A" stroke-width="1.5"/>
  <polygon points="440,370 452,375 440,380" fill="#0A0A0A"/>

  <!-- Phase 2: Registro -->
  <rect x="470" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="490" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">02</text>
  <line x1="490" y1="295" x2="710" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="490" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Registro</text>
  <text x="490" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Titulos transformam</text>
  <text x="490" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">producao em ativo</text>
  <text x="490" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">registravel no BCB.</text>
  <!-- Instrument checklist -->
  <rect x="490" y="440" width="8" height="8" fill="#0A0A0A"/>
  <text x="506" y="448" font-family="monospace" font-size="11" letter-spacing="0.06em" fill="#6B6B6B">CPR</text>
  <rect x="490" y="460" width="8" height="8" fill="#0A0A0A"/>
  <text x="506" y="468" font-family="monospace" font-size="11" letter-spacing="0.06em" fill="#6B6B6B">CDCA / CRA</text>
  <rect x="490" y="480" width="8" height="8" fill="#CCFF00"/>
  <text x="506" y="488" font-family="monospace" font-size="11" letter-spacing="0.06em" fill="#6B6B6B">CPR VERDE</text>

  <!-- Arrow 2->3 -->
  <line x1="750" y1="375" x2="830" y2="375" stroke="#0A0A0A" stroke-width="1.5"/>
  <polygon points="830,370 842,375 830,380" fill="#0A0A0A"/>

  <!-- Phase 3: Capital -->
  <rect x="860" y="240" width="260" height="270" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="880" y="280" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#0A0A0A">03</text>
  <line x1="880" y1="295" x2="1100" y2="295" stroke="#E5E3DC" stroke-width="1"/>
  <text x="880" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">Capital</text>
  <text x="880" y="370" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Mercado absorve via</text>
  <text x="880" y="390" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">registradora autorizada.</text>
  <text x="880" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Liquidez e garantia.</text>
  <!-- Big metric -->
  <text x="880" y="470" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#0A0A0A">R$70B+</text>
  <text x="880" y="490" font-family="monospace" font-size="10" letter-spacing="0.08em" fill="#6B6B6B">ATIVOS REGISTRADOS NA CERC</text>

  <!-- Bottom label -->
  <text x="80" y="600" font-family="system-ui, sans-serif" font-size="14" fill="#6B6B6B">Producao &gt; Registro &gt; Capital</text>
</svg>
